<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <img src="landscape_logo.png" alt="no internet">
         <a class="pdf" href="#">Download PDF</a>
         <a class="reg" href="#">Registration</a>
    </header>

    <div class="main">
        <h2 class="h2">Registration From</h2>
        <div class="row1">
            <label class="lp" for="Institute">Institute<p class="pl">*</p></label>
            

            <label for="Institute">Corse<p>*</p></label>
            
            
            <label class="ins" for="Institute">Your Favourite Time ?<p class="plu">*</p></label>
           
        </div>
        <div class="inrow1">
          <input type="text">

          <input class="co" type="text">

           <input class="fr" type="text">
        </div>
        <div class="row2">
            <label class="fn" for="Institute">Full Name<p class="pl">*</p></label>
            

            <label class="pr" for="parents">Parents / Guardian Name<p>*</p></label>
            
            
            <label class="email" for="Institute">Email( Write email carefully )<p class="plu">*</p></label>
           
        </div>
        <div class="inrow1">
          <input type="text">

          <input class="co" type="text">

           <input class="fr" type="text" placeholder="abc123@gmail.com">
        </div>


        <div class="row3">
            <label class="contact" for="Institute">Contact Number<p class="pl">*</p></label>
            

            <label class="city" for="Institute">City Name<p>*</p></label>
            
            
            <label class="cnic" for="Institute">CNIC / BForm<p class="plu">*</p></label>
           
        </div>
        <div class="inrow1">
          <input type="text" placeholder="03XXXXXXXXX">

          <input class="co" type="text" placeholder="Enter your city name">

           <input class="fr" type="text" placeholder="4XXXXXXXXXXXXXXX">
        </div>


        <div class="row4">
            <label class="gender" for="Institute">Gender<p class="pl">*</p></label>
            

            <label class="date" for="Institute">Date of Birth<p>*</p></label>
            
            
            <label class="last" for="Institute">Last Qualification<p class="plu">*</p></label>
           
        </div>
        <div class="inrow1">
          <input type="text">

          <input class="co" type="text">

           <input class="fr" type="text">
        </div>

        <div class="row5">
            <label class="add" for="Institute">Permenant Address<p class="pl">*</p></label>
            <input class="perme" type="text">
        </div>
        <p class="passport">Passport Size Profile Image (Face Front and Decent picture)</p>
        <div class="pic">
            <input class="file" type="file" accept="image/*">
            <p class="filep">Upload Image</p>
        </div>

        <div class="box-btn">
            <button class="btn">Submit Form</button>
        </div>
    </div>
</body>
</html>
